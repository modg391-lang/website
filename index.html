<body class="bg-gray-50 text-gray-800 font-sans">

            <div class="space-y-4">
                <a href="https://youtube.com/@tapapks?si=bdcNGukqLTOpckqn" target="_blank" class="flex items-center gap-3 text-gray-700 hover:text-red-600 transition-colors">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M21.582 6.186a2.6 2.6 0 0 0-1.83-1.841C18.136 3.9 12 3.9 12 3.9s-6.137 0-7.752.445a2.6 2.6 0 0 0-1.831 1.841C2 7.822 2 12 2 12s0 4.178.417 5.814a2.6 2.6 0 0 0 1.831 1.841c1.615.445 7.752.445 7.752.445s6.137 0 7.752-.445a2.6 2.6 0 0 0 1.83-1.841C22 16.178 22 12 22 12s0-4.178-.418-5.814ZM9.667 15.025V8.975L14.996 12l-5.329 3.025Z"/></svg>
                    <span class="font-medium">YouTube</span>
                </a>
                <a href="https://www.tiktok.com/@tapsapks?_r=1&_t=ZS-981qTLxVJUV" target="_blank" class="flex items-center gap-3 text-gray-700 hover:text-black transition-colors">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525 2c-.015.719-.013 1.439 0 2.158 1.411.082 2.825.438 4.093 1.134v3.136a7.712 7.712 0 0 1-4.093-1.123v8.528c-.012 3.528-3.082 6.309-6.602 6.07-3.238-.172-5.718-2.923-5.728-6.17.009-3.242 2.483-5.992 5.719-6.168v3.298c-1.393.076-2.585 1.144-2.67 2.535-.126 1.636 1.258 3.064 2.88 3 1.41-.013 2.518-1.218 2.518-2.628V2h3.883Z"/></svg>
                    <span class="font-medium">TikTok</span>

                <a href="https://www.facebook.com/profile.php?id=61580443751887" target="_blank" class="flex items-center gap-3 text-gray-700 hover:text-blue-600 transition-colors">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5Z"/></svg>
                    <span class="font-medium">Facebook</span>
                </a>
                <a href="https://t.me/TapApks" target="_blank" class="flex items-center gap-3 text-gray-700 hover:text-blue-500 transition-colors">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.665 3.717 3.232 10.428c-1.63.653-1.624 1.565-.298 1.972l4.493 1.403 10.43-6.57c.49-.311.94-.143.568.188L9.98 14.993l-.317 4.544c.465 0 .668-.21.926-.462l2.222-2.157 4.62 3.414c.85.47 1.464.227 1.675-.79l3.032-14.288c.287-1.157-.42-1.685-1.473-1.537Z"/></svg>
                    <span class="font-medium">Telegram</span>
                </a>
            </div>
        </div>
    </div>

    <header class="bg-[#0B1120] text-white p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 cursor-pointer" onclick="toggleDrawer()" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <span class="font-bold text-lg cursor-pointer" onclick="renderHome()">Tap Apks</span>
        </div>
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </header>

    <div id="home-view" class="block max-w-md mx-auto bg-white min-h-screen">
        <div class="p-4">
            <div class="relative">
                <input type="text" placeholder="Cari aplikasi atau game..." class="w-full border border-gray-300 rounded-lg py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </div>
            
            <h2 class="text-xl font-bold mt-6 mb-4">Terbaru</h2>
            
            <div id="game-list" class="flex flex-col pb-10">
                <!-- Games rendered here -->
            </div>
            
            <div class="mt-8 mb-8 flex justify-center">
                <button class="border border-gray-300 rounded-lg px-10 py-2 font-medium text-gray-700 w-full">Muat lebih banyak</button>
            </div>
        </div>
        <footer class="bg-[#0B1120] text-center p-4">
            <p class="text-xs text-white">© 2026 Tap Apks. All rights reserved.</p>
        </footer>
    </div>

    <div id="detail-view" class="hidden max-w-md mx-auto bg-white min-h-screen pb-10">
        <!-- Detail rendered here -->
    </div>

    <!-- Fullscreen Image Viewer -->
    <div id="image-viewer" class="fixed inset-0 bg-black bg-opacity-95 z-[100] hidden flex-col items-center justify-center">
        <button onclick="closeImageViewer()" class="absolute top-4 right-4 text-white p-1.5 bg-black bg-opacity-50 rounded-full hover:bg-opacity-70 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img id="viewer-image" class="max-w-full max-h-[90vh] object-contain px-4" src="">
    </div>

    <script>
        const games = [{"id":1,"title":"Arena Cacing","version":"v 1.0","updateDate":"Rabu, 29 juli","size":"23.82Mb","rating":500.0,"ratingCount":0,"genre":"Simulasi,","androidVersion":"7.0+","developer":"Tap-Apks","description":"# 🐛 Cacing Arena Online\n\nMasuki arena dan buktikan siapa cacing terkuat! **Cacing Arena Online** adalah game multiplayer real-time yang menguji kecepatan, strategi, dan refleksmu saat bertarung melawan pemain lain dari seluruh dunia.\n\nKumpulkan makanan untuk memperbesar tubuh cacingmu, hindari tabrakan dengan lawan yang lebih besar, dan gunakan strategi untuk menjebak musuh agar keluar dari permainan. Semakin besar cacingmu, semakin besar peluangmu untuk menguasai arena dan menduduki peringkat teratas.\n\n## 🌍 Fitur Utama\n\n🎮 Multiplayer Online\n• Bertanding melawan pemain lain secara real-time.\n• Arena selalu dipenuhi pemain aktif.\n\n🍎 Kumpulkan Makanan\n• Makan buah dan makanan yang tersebar di arena.\n• Perbesar tubuh cacingmu dan raih skor tertinggi.\n\n🏆 Leaderboard Global\n• Bersaing menjadi pemain terbaik.\n• Naikkan peringkatmu dan kuasai papan leaderboard.\n\n🚀 Boost Cepat\n• Aktifkan Boost untuk mengejar lawan atau melarikan diri dari bahaya.\n• Gunakan dengan strategi agar tidak kehilangan ukuran tubuh.\n\n🔐 Login Akun\n• Simpan progres permainan.\n• Lanjutkan bermain kapan saja menggunakan akunmu.\n\n🎨 Skin Menarik\n• Gunakan berbagai tampilan cacing yang unik.\n• Tunjukkan gaya bermainmu di arena.\n\n⚡ Gameplay Ringan\n• Kontrol sederhana dan mudah dimainkan.\n• Cocok untuk semua usia.\n\n## Cara Bermain\n\n• Gerakkan cacing untuk mengumpulkan makanan.\n• Hindari menabrak tubuh cacing lain.\n• Gunakan Boost di saat yang tepat.\n• Bertahan selama mungkin.\n• Jadilah cacing terbesar dan kuasai arena!\n\nSiap menjadi Raja Arena? Unduh sekarang dan buktikan kemampuanmu dalam pertarungan cacing online yang seru, kompetitif, dan penuh tantangan!","imageUrl":"https://ik.imagekit.io/he6c4oh6cy/file_00000000ebb88207b1747290acaa4c02.png","apkUrl":"https://www.mediafire.com/file/m541qwicizjwsah/Cacing_Arena_v1.0.apk/file","network":"Online","screenshotsStr":"https://ik.imagekit.io/he6c4oh6cy/file_000000001e4482079e9a0f79b984dbbc.png,https://ik.imagekit.io/he6c4oh6cy/file_00000000e4c8821194401debf0b02f17.png,https://ik.imagekit.io/he6c4oh6cy/file_00000000f6ec8211ad61f9f81e354a7e.png"}];

        function openImageViewer(url) {
            document.getElementById('viewer-image').src = url;
            document.getElementById('image-viewer').classList.remove('hidden');
            document.getElementById('image-viewer').classList.add('flex');
        }

        function closeImageViewer() {
            document.getElementById('image-viewer').classList.add('hidden');
            document.getElementById('image-viewer').classList.remove('flex');
            document.getElementById('viewer-image').src = '';
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawer-overlay');
            if (drawer.classList.contains('-translate-x-full')) {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                if (window.AndroidBridge) window.AndroidBridge.setDrawerOpen(true);
            } else {
                drawer.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                if (window.AndroidBridge) window.AndroidBridge.setDrawerOpen(false);
            }
        }

        function renderHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            
            const listContainer = document.getElementById('game-list');
            listContainer.innerHTML = '';
            
            games.forEach(game => {
                const gameEl = document.createElement('div');
                gameEl.className = 'flex items-center justify-between py-4 border-b border-gray-200 cursor-pointer';
                gameEl.onclick = () => renderDetail(game.id);
                gameEl.innerHTML = `
                    <div class="flex items-center gap-4">
                        <img src="${game.imageUrl}" class="w-16 h-16 rounded-xl object-cover bg-gray-100">
                        <div>
                            <h3 class="font-bold text-gray-900">${game.title}</h3>
                            <p class="text-xs text-gray-500 mt-1">${game.version} • ${game.updateDate}</p>
                            <div class="flex items-center gap-1 mt-1">
                                <svg class="w-4 h-4 star-icon" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                <span class="text-sm font-medium">${game.rating}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span class="text-xs text-gray-500 mb-2">${game.size}</span>
                        <a href="${game.apkUrl}" onclick="event.stopPropagation()" class="bg-blue-600 text-white text-sm font-medium px-4 py-1.5 rounded-lg hover:bg-blue-700">Download</a>
                    </div>
                `;
                listContainer.appendChild(gameEl);
            });
        }

        function renderDetail(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            
            document.getElementById('home-view').classList.add('hidden');
            const detailContainer = document.getElementById('detail-view');
            detailContainer.classList.remove('hidden');
            window.scrollTo(0,0);
            
            let screenshotsHtml = '';
            if (game.screenshotsStr) {
                const urls = game.screenshotsStr.split(',').map(s => s.trim()).filter(s => s);
                if(urls.length > 0) {
                    screenshotsHtml = `
                        <div class="mt-6">
                            <h3 class="font-bold text-lg mb-2">Screenshot</h3>
                            <div class="flex overflow-x-auto gap-3 pb-2">
                                ${urls.map(url => `<img src="${url}" onclick="openImageViewer('${url}')" class="w-60 h-32 object-cover rounded-lg cursor-pointer">`).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            detailContainer.innerHTML = `
                <div class="p-4">
                    <div class="text-blue-600 text-sm mb-4 cursor-pointer" onclick="renderHome()">Beranda > Game > ${game.title}</div>
                    
                    <div class="flex gap-4 mb-6">
                        <img src="${game.imageUrl}" class="w-24 h-24 rounded-2xl object-cover bg-gray-100 shadow-sm">
                        <div class="flex-1">
                            <h2 class="text-xl font-bold leading-tight mb-2">${game.title}</h2>
                            <div class="flex items-center gap-2 mb-2">
                                <svg class="w-4 h-4 star-icon" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                <span class="text-sm font-medium">${game.rating} (${game.ratingCount})</span>
                                <span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded ml-2">${game.genre}</span>
                            </div>
                        </div>
                    </div>

                    <a href="${game.apkUrl}" class="block w-full bg-blue-600 text-white text-center font-bold py-3 rounded-xl hover:bg-blue-700 mb-3 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download APK (${game.size})
                    </a>

                    <div class="grid grid-cols-4 gap-2 border border-gray-200 rounded-xl p-4 mt-6">
                        <div class="text-center">
                            <div class="text-xs text-gray-500 mb-1">Versi</div>
                            <div class="text-sm font-bold">${game.version}</div>
                        </div>
                        <div class="text-center">
                            <div class="text-xs text-gray-500 mb-1">Ukuran</div>
                            <div class="text-sm font-bold">${game.size}</div>
                        </div>
                        <div class="text-center">
                            <div class="text-xs text-gray-500 mb-1">Developer</div>
                            <div class="text-sm font-bold truncate">${game.developer}</div>
                        </div>
                        <div class="text-center">
                            <div class="text-xs text-gray-500 mb-1">Update</div>
                            <div class="text-sm font-bold">${game.updateDate}</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between border border-gray-200 rounded-xl p-4 mt-3">
                        <div class="text-sm text-gray-600">Requires Android</div>
                        <div class="text-sm font-bold">${game.androidVersion}</div>
                    </div>
                    
                    <div class="flex items-center justify-between border ${(game.network || 'Online') === 'Online' ? 'border-green-200 bg-green-50' : 'border-gray-200 bg-gray-50'} rounded-xl p-4 mt-3">
                        <div class="text-sm ${(game.network || 'Online') === 'Online' ? 'text-green-700' : 'text-gray-600'} font-medium">Network</div>
                        <div class="text-sm font-bold ${(game.network || 'Online') === 'Online' ? 'text-green-700' : 'text-gray-800'} flex items-center gap-1">
                            ${(game.network || 'Online') === 'Online' ? '<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>' : ''}
                            ${game.network || 'Online'}!
                        </div>
                    </div>
                    
                    ${screenshotsHtml}

                    <div class="border border-gray-200 rounded-xl p-4 mt-6">
                        <h3 class="font-bold text-lg mb-2">Deskripsi</h3>
                        <div class="text-sm text-gray-700 whitespace-pre-wrap">${game.description}</div>
                    </div>
                </div>
            `;
        }

        renderHome();
    </script>
</body>
</html>
